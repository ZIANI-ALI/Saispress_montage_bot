name: Montage bot

on:
  schedule:
    # Backup: kol run kaylanci run jay b rasso; cron ghir ila t9at3at l chaîne.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Ch7al d d9i9a ybqa l bot khddam"
        default: "330"

permissions:
  contents: read
  actions: write   # bach run y-lanci run jay (chaîne 24/24)

concurrency:
  group: montage-bot
  cancel-in-progress: false

jobs:
  run:
    # 24/24 ghir ila variable VIDEO_BOT_ENABLED = true (Settings > Secrets and variables > Actions > Variables).
    if: github.event_name == 'workflow_dispatch' || vars.VIDEO_BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # bdya d l job: l bot kay7sab RUN_MINUTES mn hna (timeout-minutes kay7sab mn hna 7tta howa)
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # ffmpeg (montage) + fribidi (Pillow kay7tajha l l 7rouf l 3arbiya mrbouta).
      # L .deb kaytkhbbaw f cache: mirror d Ubuntu mrat kay3tel (40 d9i9a) w kaybl3 l w9t d l bot.
      - id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}

      - run: |
          if ! command -v ffmpeg >/dev/null || ! dpkg -s libfribidi0 >/dev/null 2>&1; then
            if ls ~/apt-debs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/apt-debs/*.deb >/dev/null; then
              echo "ffmpeg mn l cache"
            else
              mkdir -p ~/apt-debs/partial
              sudo apt-get update -q
              sudo apt-get install -y -q -o Dir::Cache::archives="$HOME/apt-debs" ffmpeg libfribidi0
              sudo rm -rf ~/apt-debs/partial ~/apt-debs/lock
              sudo chown -R "$USER" ~/apt-debs
            fi
          fi
          ffmpeg -version | head -1

      - if: steps.debs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: ${{ steps.debs.outputs.cache-primary-key }}

      - name: Run bot
        run: python bot.py
        env:
          VIDEO_BOT_TOKEN: ${{ secrets.VIDEO_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          VIDEO_ALLOWED_IDS: ${{ vars.VIDEO_ALLOWED_IDS }}
          RUN_MINUTES: ${{ inputs.minutes || vars.RUN_MINUTES || '330' }}
          MONTAGE_PRESET: ${{ vars.MONTAGE_PRESET || 'slow' }}
          MONTAGE_CRF: ${{ vars.MONTAGE_CRF || '17' }}
          TITLE_SECONDS: ${{ vars.TITLE_SECONDS || '4.2' }}

      - name: Lanci run jay (24/24)
        if: ${{ !cancelled() && vars.VIDEO_BOT_ENABLED == 'true' }}
        run: gh workflow run montage-bot.yml --repo "$GITHUB_REPOSITORY" --ref main -f minutes=330
        env:
          GH_TOKEN: ${{ github.token }}
